<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.staticfile.org/twitter-bootstrap/5.1.1/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.staticfile.org/twitter-bootstrap/5.1.1/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.staticfile.org/jquery/2.1.1/jquery.min.js"></script>
    <title>{% block title %}后台管理{% endblock %}</title>
<style>
        .card {
            padding: 20px;
            width: 50%; /* 设置每个卡片的宽度为容器的一半 */
            height: auto;
        }

        .vertical-divider {
            border-left: 1px solid #ccc; /* 竖线的样式，可以根据需要自定义 */
            height: 100%; /* 确保竖线的高度与列相同 */
            margin: 0 15px; /* 根据需要调整左右外边距 */
        }
    </style>
</head>
<body>
<div class="row" style="">
    <div class="card bg-dark text-white" style="width: 100%;height: 80px;margin-top: -30px;">
        <div class="card-body">
            <h3 style="display: inline-block;margin-left: 60px;color: white">后台管理</h3>

            <a style="margin-left: 10px;color: white" href="/logout">退出系统</a>
        </div>
    </div>
    <div class="row">
        <div class="col-md-2">
            <div class="row">
                <nav class="navbar  bg-light navbar-light justify-content-center" style="background-color: white;">
                    <ul class="navbar-nav" style="height: 1000px">
                        <li class="nav-item ">
                            <a class="nav-link" id = 'menu-home' href="/teacher/teacher_homepage.html">
                                <img src="../../static/image/avatar.png" style="height: 40px;">个人信息
                            </a>
                        </li>
                        <li class="nav-item ">
                            <a class="nav-link " id='menu-class' href="/teacher/teacher_class.html"><img src="../../static/image/schedule.png" style="height: 40px;">课程管理</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" id='menu-my_race' href="/teacher/teacher_my_race.html"><img alt="课程管理" src="../../static/image/trophy.png"
                                                                     style="height: 40px;">比赛管理</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link " id='menu-student_submit' href="/teacher/teacher_student_submit.html"><img src="../../static/image/_history.png"
                                                                       style="height: 40px;">记录查询</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link " id='menu-add_admin' href="/teacher/teacher_add_admin.html"><img src="../../static/image/add_teacher.png"
                                                                                         style="height: 40px;">添加教师</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link " id='menu-dataShare' href="/blog/"><img src="../../static/image/blog.png"
                                                                                         style="height: 40px;">知识分享</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link " id='menu-add_admin' href="/blog/teacher/article.html"><img src="../../static/image/blogManage.png"
                                                                                         style="height: 40px;">知识管理</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link " id='menu-dataShare' href="/blog/dataShare.html"><img src="../../static/image/dataShare.png"
                                                                                         style="height: 40px;">数据共享</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link " id='menu-add_admin' href="/blog/teacher/expert.html"><img src="../../static/image/duty.png"
                                                                                         style="height: 40px;">值班管理</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link " id='menu-add_admin' href="/logout"><img
                                    src="../../static/image/logout.png"
                                    style="height: 40px;">退出系统</a>
                        </li>

                    </ul>
                </nav>
            </div>
        </div>
        <div class="col-md-10">
        <br>
            {% block content %}
 <div>这里是默认内容，所有继承自这个模板的，如果不覆盖就显示这里的默认内容。</div>
{% endblock %}
        </div>

</body>
</html>
