{% extends 'Dashboard/master.html' %}

{% block content %}
<script type="text/javascript" charset="utf-8" src="/static/ueditor/ueditor.config.js"></script>
<script type="text/javascript" charset="utf-8" src="/static/ueditor/ueditor.all.js"></script>
<form class="form-horizontal" enctype="multipart/form-data" role="form" method="post" action="" name="upfile">
{% csrf_token %}
<div class="row">
    <div class="col-md-6">
           <h4>内容</h4>
            <script type="text/plain" id="myEditor" style="width:100%;height:300px;" name="content" value="">
{% if article.content %}
{{article.content|safe}}
{% else %}
这里输入文章的内容
{% endif %}
            </script>
            <script type="text/javascript">
                var ue =UE.getEditor('myEditor');
            </script>

    </div>
    <div class="col-md-4">
        <div class="row">
            <h4>标题</h4>
            <input type="text" class="form-control"  name="title" placeholder="请输入标题" value="{{ article.title }}" required>
            <h4>封面图片<input name="img" type="file"  /></h4>
            <h4>摘要</h4>
            <textarea class="form-control"  rows="4" name="summary" placeholder="请输入摘要" >{{ article.summary }}</textarea>
        </div>

    <div style="height:20px"></div>
    <div class="row">
        <h4  class="col-md-4">类别</h4>
        <div class="col-md-8">
            <select id="category" name="category"  class="form-control ">
                <option value="编程基础">编程基础</option>
                <option value="学习案例">学习案例</option>
                <option value="特征工程">特征工程</option>
                <option value="算法模型">算法模型</option>
             </select>
         </div>
    </div>
    <div class="row">
        <h4  class="col-md-4">标签</h4>
        <div class="col-md-8">
            <input id="category" name="tags"  class="form-control " placeholder="用于检索" value="{{ article.tags }}" required>
             </input>
         </div>
    </div>
    <div class="row">
        <h4  class="col-md-4">日期</h4>
        <div class="col-md-8">
            <input type="date" name="time" class="form-control" value="{{article.pub_time|date:"Y-m-d"}}"  required/>
         </div>
    </div>
        <div class="row">
            <button type="submit" class="btn btn-success" style="width:100%" >点击提交</button>
        </div>
    </div>
    <div class="col-md-2">
        {% if article.img %}
            <img src="../media/article/{{article.img}}" class="img-rounded" width="60%">
        {% else %}
            <img src="../media/article/default.png" class="img-rounded" width="60%">
        {% endif %}
    </div>
</div>


</form>
<script>
 $("#article").attr("class","active")
{% if notice %}
    alert("{{notice}}")
{% endif %}
$("#category").find("option[value='{{article.category}}']").attr("selected",true);

</script>
    
        
      
          

   


{% endblock %}
