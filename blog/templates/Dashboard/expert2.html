{% extends 'Dashboard/master.html' %}

{% block content %}
<h1>人员信息填写</h1>
<div style="height:20px"></div>
 <form enctype="multipart/form-data" role="form" method="post" action="">
{% csrf_token %}
<div class="row">
    <div class="col-md-3">

        {% if expert.avatar %}
            <img src="../media/avatar/{{expert.avatar}}" class="img-rounded" width="60%">
        {% else %}
            <img src="../media/avatar/default.jpg" class="img-rounded" width="60%">
        {% endif %}

        <div class="form-group">
            <h3>头像</h3>
            <h4><input name="avatar" type="file"  /> </h4>

        </div>

    </div>
    <div class="col-md-3">
        <div class="form-group">
            <label >姓名</label>
            <input type="text" class="form-control" name="name" placeholder="请输入名称" value ="{{expert.name}}">
        </div>

        <div class="form-group">
            <label >擅长领域</label>
            <textarea class="form-control" name="domain" rows="3">{{expert.domain}}</textarea>
        </div>
        <div class="form-group">
            <label >个人简介</label>
            <textarea class="form-control" name="introduction" rows="5">{{expert.introduction}}</textarea>
        </div>
    </div>
     <div class="col-md-3">

        <div class="form-group">
            <label >手机</label>
            <input type="text" class="form-control" name="phone" placeholder="请输入手机" value ="{{expert.phone}}">
        </div>
        <div class="form-group">
            <label >微信</label>
            <input type="text" class="form-control" name="wechat" placeholder="请输入微信" value ="{{expert.wechat}}">
        </div>
        <div class="form-group">
            <label >QQ</label>
            <input type="text" class="form-control" name="qq" placeholder="请输入QQ" value ="{{expert.qq}}">
        </div>
         <div class="form-group">
            <label >费用</label>
            <input type="text" class="form-control" name="price" placeholder="请输入费用" value ="{{expert.price}}">
        </div>
       <button type="submit" class="btn btn-success" style="width:100%">点击提交</button>
    </div>
</div>
</form>
    
<script>
    $("#expert").attr("class","active")
</script>
      
          

   


{% endblock %}
